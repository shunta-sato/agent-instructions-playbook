name: Validate agent instructions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-agent-instructions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify contracts, tools and regression evidence
        run: make verify
