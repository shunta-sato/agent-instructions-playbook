name: Stage RCA specialist follow-up

on:
  push:
    branches: [astra/contract-first-redesign]
    paths: [.github/workflows/rca-followup.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply lightweight evidence-backed RCA specialist
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          skill_dir = root / '.agents/skills/bug-investigation-and-rca'
          skill_dir.mkdir(parents=True, exist_ok=True)
          (skill_dir / 'SKILL.md').write_text('''---
          name: bug-investigation-and-rca
          description: "Use for non-trivial or unclear bugs, regressions, crashes, hangs, flakes, incidents, or explicit root-cause/RCA work where the cause must be established from evidence."
          ---

          # Evidence-backed bug investigation

          Use this skill when the defect is not already explained by a direct, verified local cause, or when the request asks for root cause. An obvious typo or small defect with a clear cause can stay on the ordinary working contract.

          Establish the observed failure and relevant environment first. Prefer a reproducible signal, failing test, trace, log, dump, or other discriminating observation. If reproduction is unavailable, say so and use the strongest available evidence without turning inference into fact.

          Keep observations, live hypotheses, and confirmed cause distinct. A final patch passing is evidence that behavior changed; by itself it does not prove why the original failure occurred. Choose the cheapest next observation that can distinguish plausible explanations. Change an uninformative approach instead of repeating it. There is no required hypothesis count, Five Whys sequence, or retry limit.

          When a fix is requested, address the supported cause rather than only hiding the symptom. Verify the original failure path and relevant neighboring boundaries at the lowest useful level, plus higher-level behavior when the contract crosses a real integration boundary. A regression check should fail on the defective behavior and pass with the fix when that comparison is practical.

          Distinguish a root-cause fix from a mitigation or workaround. A retained workaround needs its risk and removal/revisit condition when those matter to the supported use. Do not invent a prevention project for every bug.

          Use other specialists only when the evidence reaches their concrete boundary, for example concurrency, performance, auth/session, database migration, target runtime, or generated cross-host workflow semantics. Escalate to `lessons-learned` when the useful output is durable learning from a recurring or consequential process/tool/instruction failure, not for every single bug.

          Report the symptom, the confirmed cause or remaining hypothesis, decisive evidence, the fix when requested, verification, and material limits. Create a standalone RCA document only when the requester, incident process, compliance rule, or downstream consumer actually needs one.
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          mirror = root / '.claude/skills/bug-investigation-and-rca'
          if mirror.exists() or mirror.is_symlink():
              mirror.unlink()
          mirror.symlink_to('../../.agents/skills/bug-investigation-and-rca')

          profiles_path = root / 'profiles.json'
          profiles = json.loads(profiles_path.read_text())
          core = profiles['profiles']['core']
          if 'bug-investigation-and-rca' not in core:
              core.append('bug-investigation-and-rca')
          profiles_path.write_text(json.dumps(profiles, indent=2) + '\n')

          disposition_path = root / 'docs/skill-disposition.json'
          disposition = json.loads(disposition_path.read_text())
          item = next(x for x in disposition['skills'] if x['old'] == 'bug-investigation-and-rca')
          item['disposition'] = 'rewritten'
          item['destination'] = 'bug-investigation-and-rca'
          disposition_path.write_text(json.dumps(disposition, indent=2) + '\n')

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          readme = readme.replace(
              '| core | repo-onboarding, decision-analysis, boundary-migration, workflow-contracts |',
              '| core | repo-onboarding, decision-analysis, boundary-migration, workflow-contracts, bug-investigation-and-rca |')
          readme = readme.replace(
              'Old Skill names, aggregate links, `--overlay`, generated indexes and model-routing configs\nare retired without aliases or fallbacks.',
              'Retired Skill names, aggregate links, `--overlay`, generated indexes and model-routing configs\nremain retired without aliases or fallbacks. `bug-investigation-and-rca` is intentionally rewritten in place as a lightweight evidence contract, not restored as the old procedural workflow.')
          readme = readme.replace('The 21 current entrypoints\nare a design choice', 'The 22 current entrypoints\nare a design choice')
          readme_path.write_text(readme)

          tests_path = root / 'tests/test_contract_first.py'
          tests = tests_path.read_text()
          old = "['boundary-migration','decision-analysis','repo-onboarding','workflow-contracts']"
          new = "['boundary-migration','bug-investigation-and-rca','decision-analysis','repo-onboarding','workflow-contracts']"
          if old not in tests:
              raise SystemExit('default-selection assertion not found')
          tests_path.write_text(tests.replace(old, new, 1))

          cases_path = root / 'evals/cases.json'
          cases = json.loads(cases_path.read_text())
          if not any(c['id'] == 'root-cause-evidence' for c in cases['cases']):
              cases['cases'].append({
                  'commands': 'Only local fixture inspection is authorized. No network, credentials, deployment or production access.',
                  'skills': ['bug-investigation-and-rca'],
                  'id': 'root-cause-evidence',
                  'prompt': 'Investigate a regression where a request succeeds after adding a retry, but the original cause is still unclear. Determine what is actually supported by the supplied failure evidence. If a fix is justified, verify the original failure path. Do not call the retry itself the root cause or create a mandatory RCA document.',
                  'files': {
                      'context.md': 'Observed: the first request fails with connection reset; an immediate retry often succeeds. A recent configuration change is suspected but unproven. The operator must attach the actual trace/repro before a cause can be confirmed.\n'
                  },
                  'oracle': None,
                  'review': {
                      'required': [
                          'Separate observed failure, hypothesis, confirmed cause and remaining unknowns',
                          'Treat passing-after-retry as behavior evidence, not root-cause proof',
                          'Request or use discriminating evidence before a causal claim'
                      ],
                      'forbidden': [
                          'Mandatory Five Whys or fixed hypothesis count',
                          'Standalone RCA report without a real consumer',
                          'Retry success presented as proof of the original cause'
                      ]
                  }
              })
          cases_path.write_text(json.dumps(cases, indent=2) + '\n')
          PY
          git diff --check
          git status --short
      - name: Verify full playbook
        run: make verify
      - name: Commit follow-up
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add .agents/skills/bug-investigation-and-rca .claude/skills/bug-investigation-and-rca profiles.json docs/skill-disposition.json README.md tests/test_contract_first.py evals/cases.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: restore evidence-backed bug investigation specialist' -m 'Keep RCA cause claims evidence-backed without restoring mandatory Five Whys, fixed hypothesis counts, retry limits, or per-bug report packs. Add the rewritten specialist to core and add an Astra behavior seed for root-cause evidence discipline.'
          git push origin HEAD:refs/heads/astra/contract-first-redesign
